name: social

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social}
      POSTGRES_USER: ${POSTGRES_USER:-social_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?Set DATABASE_URL in .env}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-dir", "/migrations", "up"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT:?Set HTTP_PORT in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_ADDR: ${REDIS_ADDR:?Set REDIS_ADDR in .env}
      REDIS_DB: ${REDIS_DB:?Set REDIS_DB in .env}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:?Set REDIS_CACHE_TTL in .env}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:?Set QUEUE_CAPACITY in .env}
      WORKER_COUNT: ${WORKER_COUNT:?Set WORKER_COUNT in .env}
      LIKE_EXECUTION_TIMEOUT: ${LIKE_EXECUTION_TIMEOUT:?Set LIKE_EXECUTION_TIMEOUT in .env}
    ports:
      - "127.0.0.1:${HTTP_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 25s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:?Set PGADMIN_PORT in .env}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

